name: MFP POH Tests

on:
  schedule:
    # GitHub cron is UTC only: 03:00 UTC = 10:00 PM EST (11:00 PM during EDT)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression applied within features/MFP_POH'
        required: false
        default: 'not @ignore'
        type: string

permissions:
  contents: read

concurrency:
  group: mfp-poh-tests
  cancel-in-progress: false

jobs:
  mfp-poh:
    runs-on: mdp-arm-runner
    timeout-minutes: 240

    env:
      HEADLESS: 'true'
      TAGS: ${{ github.event.inputs.tags || 'not @ignore' }}
      MFP_UAT_USERNAME: ${{ secrets.MFP_UAT_USERNAME }}
      MFP_UAT_PASSWORD: ${{ secrets.MFP_UAT_PASSWORD }}
      MFP_UAT_TOTP_SECRET: ${{ secrets.MFP_UAT_TOTP_SECRET }}
      SALESFORCE_TOTP_SECRET: ${{ secrets.SALESFORCE_TOTP_SECRET }}
      APP_URL_UAT: ${{ secrets.APP_URL_UAT }}
      MAILOSAUR_USERNAME: ${{ secrets.MAILOSAUR_USERNAME }}
      MAILOSAUR_PASSWORD: ${{ secrets.MAILOSAUR_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Display GitHub Runner IP
        run: |
          echo "GitHub Runner Public IP:"
          curl -fsS https://api.ipify.org
          echo ""
      - name: Validate required Salesforce secrets
        shell: bash
        run: |
          for variable in APP_URL_UAT MFP_UAT_USERNAME MFP_UAT_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required GitHub Actions secret $variable is empty or unavailable."
              exit 1
            fi
            if [[ "${!variable}" == *$'\r'* || "${!variable}" == *$'\n'* ]]; then
              echo "::error::GitHub Actions secret $variable contains a line break. Update it without copied line endings."
              exit 1
            fi
          done
          for variable in APP_URL_UAT MFP_UAT_USERNAME; do
            if [[ "${!variable}" == *[[:space:]]* ]]; then
              echo "::error::GitHub Actions secret $variable contains whitespace. Update it with the exact UAT value."
              exit 1
            fi
          done
          if [[ "$APP_URL_UAT" != https://* ]]; then
            echo "::error::APP_URL_UAT must be an HTTPS Salesforce login URL."
            exit 1
          fi
          for variable in MFP_UAT_TOTP_SECRET SALESFORCE_TOTP_SECRET; do
            if [[ -n "${!variable}" && ! "${!variable}" =~ ^[A-Za-z2-7]{16,}={0,6}$ ]]; then
              echo "::error::Optional secret $variable must contain only the Base32 authenticator setup key."
              exit 1
            fi
          done
          echo "Required Salesforce secrets are available and passed format checks; values are not logged."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and unpack Allure CLI
        run: mvn -B -ntp -DskipTests test-compile

      - name: Make Allure CLI executable
        run: chmod +x target/allure-cli/allure-*/bin/allure

      - name: Install Playwright Chromium and OS dependencies
        run: >
          mvn -B -ntp exec:java -e
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install --with-deps chromium"

      - name: Run MFP_POH feature files
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: >
          mvn -B -ntp test
          -Dcucumber.features=src/test/resources/features/MFP_POH
          -Dcucumber.filter.tags="$TAGS"
          -Dtags="$TAGS"
          -DHEADLESS=true
          -DTRACE_SNAPSHOTS=true

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfp-poh-allure-report-${{ github.run_number }}
          path: report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Cucumber and Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfp-poh-test-results-${{ github.run_number }}
          path: |
            target/cucumber-reports/
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload videos and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mfp-poh-videos-traces-${{ github.run_number }}
          path: |
            target/videos/
            target/traces/
            target/screenshots/
          if-no-files-found: ignore
          retention-days: 14
