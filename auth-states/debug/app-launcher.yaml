                  - heading "General Announcements" [level=1] [ref=e298]:
                    - strong [ref=e299]: General Announcements
                  - strong
                  - paragraph [ref=e300]:
                    - strong [ref=e301]: General announcements regarding upgrades to all Salesforce applications will be displayed in this section.
                  - strong
                  - paragraph [ref=e302]:
                    - strong [ref=e303]: Tracker-specific deployment updates will appear on the specific Trackers Home page in the upper right corner.
                  - strong
                  - paragraph [ref=e304]:
                    - text: Here is a list of general enhancements deployed into production on
                    - strong [ref=e305]: "January 28, 2026:"
                  - paragraph
                  - heading "Upgrading Users to Salesforce Service Cloud License" [level=2] [ref=e306]:
                    - strong [ref=e307]: Upgrading Users to Salesforce Service Cloud License
                  - text: This license upgrade will not impact your experience. Users will not see any changes within the Tracker applications.
                  - heading "Creation of a New MACTrack landing page" [level=2] [ref=e308]:
                    - strong [ref=e309]: Creation of a New MACTrack landing page
                  - text: To standardize the log in experience for all users, a new MACTrack landing page was created. There are several sections to the new landing page we will describe below, This landing page will display all of the applications your user profile is authorized access to.
                  - list [ref=e310]:
                    - heading "App Launcher Section" [level=3] [ref=e311]:
                      - strong [ref=e312]: App Launcher Section
                  - text: Salesforce will display the trackers that are available to your profile. If an application tile is not visible in this section, it may indicate that access has not been granted. To request access, please email the Help Desk and include the specific Tracker application you need, along with the name of the manager who approved your request.
                  - list [ref=e313]:
                    - heading "New App Launcher Section on the Application Home Screen" [level=3] [ref=e314]:
                      - strong [ref=e315]: New App Launcher Section on the Application Home Screen
                  - text: To improve navigation, users can now switch between Tracker applications directly from within any Tracker. A new App Launcher section is available on the upper‑right side of each Tracker’s Home screen, displaying icons for all applications you are authorized to access. Select any icon to open that application. You may also return to the main MACTrack landing page by clicking the 9‑dot App Launcher icon in the upper‑left corner next to the Tracker name, typing “MACTrack”, and selecting the MACTrack option.
                  - list [ref=e316]:
                    - heading "Quick Links and Help Center Section" [level=3] [ref=e317]:
                      - strong [ref=e318]: Quick Links and Help Center Section
                  - text: The links in these sections provides users quick access to webpages, forms and ability to communicate quickly to the help desk to submit questions and/or concerns.
                  - list [ref=e319]:
                    - heading "Frequently Asked Question Section" [level=3] [ref=e320]:
                      - strong [ref=e321]: Frequently Asked Question Section
                  - text: This section is coming soon. We will post the most frequently asked questions and answers to the questions.
